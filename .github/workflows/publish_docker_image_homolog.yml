name: Build Docker image

on:
  push:
    branches:
      - develop

jobs:
  build_deploy:
    name: Build and Deploy
    runs-on: ${{ vars.CI_RUNNER }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: evoapicloud/evolution-api
          tags: homolog

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          # Só amd64 (emenda ADR-015 2026-09-23): o runner self-hosted usa docker
          # rootless e não registra binfmt/qemu (medido na ci-2: só python3.12 em
          # /proc/sys/fs/binfmt_misc). Nossos clusters são todos amd64 (medido).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
