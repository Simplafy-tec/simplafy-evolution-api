name: Check Code Quality

on: 
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  check-lint-and-build:
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Node
      uses: actions/setup-node@v5
      with:
        node-version: 20.x

    # Cache do GitHub removido (emenda ADR-015 2026-09-23). Repo publico roda em
    # runner do GitHub (vars.CI_RUNNER=ubuntu-latest): o grupo self-hosted da org
    # nao aceita repo publico, por seguranca. Sem cache, o npm baixa do zero.
    - name: Install packages
      run: npm ci
    
    - name: Check linting
      run: npm run lint:check

    - name: Generate Prisma client
      run: npm run db:generate

    - name: Run tests
      run: npm test

    - name: Check build
      run: npm run build
