name: Check Code Quality

on: 
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  check-lint-and-build:
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Node
      uses: actions/setup-node@v5
      with:
        node-version: 20.x

    # Cache do GitHub removido (emenda ADR-015 2026-09-23). ~/.npm só persiste
    # quando a var CI_RUNNER do repo apontar para runner self-hosted (hoje
    # aponta para ubuntu-latest: sem cache até essa troca).
    - name: Install packages
      run: npm ci
    
    - name: Check linting
      run: npm run lint:check

    - name: Generate Prisma client
      run: npm run db:generate

    - name: Run tests
      run: npm test

    - name: Check build
      run: npm run build
