name: Simplafy Hotfix v2.3.7

on:
  push:
    branches:
      - lee/fix-meta-missing-profile-v237
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: evolution-hotfix-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE: ghcr.io/simplafy-tec/evolution-api
  DISTRIBUTION_IMAGE: registry.simplafy.com.br/simplafy-tec/evolution-api
  INFISICAL_DOMAIN: https://secrets.simplafy.com.br
  INFISICAL_IDENTITY_ID: e2e68b3f-fa45-4476-8775-a1b3a57e111c

jobs:
  validate:
    name: Test, lint and build
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Regression test
        run: npm run test:ci

      - name: Lint
        run: npm run lint:check

      - name: Generate Prisma client
        env:
          DATABASE_PROVIDER: postgresql
        run: npm run db:generate

      - name: Build
        run: npm run build

  image:
    name: Build and publish immutable image
    needs: validate
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Resolve immutable tag
        id: meta
        run: echo "tag=v2.3.7-simplafy-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push to GHCR
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-v237
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-v237,mode=max

      - name: Load Distribution credentials from Infisical
        id: infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          project-slug: simplafy-infra-opzw
          env-slug: prod
          secret-path: /cicd

      - name: Mirror immutable tag to Distribution
        timeout-minutes: 10
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "${REGISTRY_CI_PASSWORD}" | docker login registry.simplafy.com.br -u ci-push --password-stdin
          docker buildx imagetools create \
            --tag "${DISTRIBUTION_IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}"
          docker logout registry.simplafy.com.br || true

      - name: Publish image proof
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image=${IMAGE}:${TAG}"
          echo "digest=${DIGEST}"
